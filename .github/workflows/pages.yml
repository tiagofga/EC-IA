name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'visualizacoes/**'
      - 'estudos-guiados/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt ghp-import
      - name: Prepare MkDocs sources
        run: |
          mkdir -p docs/estudos-guiados
          cp -R estudos-guiados/01-introducao docs/estudos-guiados/01-introducao
          cp -R estudos-guiados/02-agentes docs/estudos-guiados/02-agentes
          cp -R estudos-guiados/03-conhecimento docs/estudos-guiados/03-conhecimento
          cp -R estudos-guiados/04-busca docs/estudos-guiados/04-busca
      - run: mkdocs build --strict
      - name: Include interactive visualizations
        run: |
          mkdir -p site/visualizacoes
          cp -R visualizacoes/04-busca site/visualizacoes/04-busca
      - run: ghp-import -n -p -f site
