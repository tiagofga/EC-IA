name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'visualizacoes/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt ghp-import
      - run: mkdocs build --strict
      - name: Include interactive visualizations
        run: |
          mkdir -p site/visualizacoes
          cp -R visualizacoes/04-busca site/visualizacoes/04-busca
      - run: ghp-import -n -p -f site
