<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matriz de confusão e métricas</title><style>body{font:18px system-ui,Arial;margin:0;background:#f9fafc;color:#171c38}.wrap{max-width:830px;margin:35px auto;padding:22px}h1{background:#2935aa;color:white;padding:20px;border-radius:10px}input[type=range]{width:100%}.card{background:white;border:1px solid #c8cde1;border-radius:10px;padding:24px}.track{height:28px;background:#cc3048;border-radius:8px;overflow:hidden}.track div{height:100%;background:#2549a5}.inputs{display:flex;gap:12px;flex-wrap:wrap}.inputs input{width:90px;display:block;font-size:18px}svg{width:100%;height:280px}p{line-height:1.6}</style></head><body><main class="wrap"><h1>Matriz de confusão e métricas</h1><div class="card"><p>Altere os controles e observe as consequências. Esta é uma visualização conceitual: não substitui o ajuste real dos modelos.</p><div class="inputs"><label>tn<input id="tn" type="number" min="0" value="90" oninput="draw()"></label><label>fp<input id="fp" type="number" min="0" value="0" oninput="draw()"></label><label>fn<input id="fn" type="number" min="0" value="4" oninput="draw()"></label><label>tp<input id="tp" type="number" min="0" value="49" oninput="draw()"></label></div><p id="metric"></p><p>Classe positiva: maligno (1). FN significa caso maligno previsto como benigno.</p></div><p><a href="README.md">Notas de uso da visualização</a></p></main><script>function draw(){let tn=+document.getElementById('tn').value,fp=+document.getElementById('fp').value,fn=+document.getElementById('fn').value,tp=+document.getElementById('tp').value;let r=(a,b)=>b?a/b:0,precision=r(tp,tp+fp),recall=r(tp,tp+fn),acc=r(tp+tn,tp+tn+fp+fn),f1=r(2*precision*recall,precision+recall);document.getElementById('metric').textContent='Acurácia '+acc.toFixed(3)+' | Precisão '+precision.toFixed(3)+' | Recall '+recall.toFixed(3)+' | F1 '+f1.toFixed(3);}draw();</script></body></html>
