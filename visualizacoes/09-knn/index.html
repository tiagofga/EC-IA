<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vizinhos e votação KNN</title><style>:root{color-scheme:light dark;font-family:system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#182636;font-size:16px;line-height:1.6}.wrap{width:min(100% - 2rem,820px);margin:2rem auto}h1{font-size:clamp(1.35rem,3vw,2rem);line-height:1.3;background:#19528c;color:#fff;padding:1.3rem 1.5rem;border-radius:12px;margin:0 0 1rem}.card{background:#fff;border:1px solid #c9d7e5;border-radius:12px;padding:1.5rem;box-shadow:0 4px 16px #15283a0b}p{margin:.65rem 0 1.1rem}label{display:block;font-weight:650}input[type=range]{display:block;width:100%;margin:1rem 0;accent-color:#187342}input[type=number]{display:block;width:100%;min-height:44px;padding:.5rem;border:1px solid #8396a9;border-radius:6px;font-size:1rem}.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1rem}svg{width:100%;height:auto;max-height:300px;background:#f8fafc;border:1px solid #d4e1ee;border-radius:8px}output{font-variant-numeric:tabular-nums;color:#17603c}#metric{font-weight:650;line-height:1.8}.track{height:28px;background:#bf3e51;border-radius:7px;overflow:hidden}.track div{height:100%;background:#2859b0}a{color:#185fa8}a:focus-visible,input:focus-visible{outline:3px solid #e2a93a;outline-offset:3px}@media(prefers-color-scheme:dark){body{background:#121820;color:#e4eaf1}.card{background:#1d2834;border-color:#415364}svg{background:#eaf0f7}a{color:#8bc3ff}output{color:#8bddad}}</style></head><body><main class="wrap"><h1>Vizinhos e votação KNN</h1><div class="card"><p>Altere um parâmetro por vez, observe a mudança e compare com a teoria. Demonstração conceitual, sem treinamento de modelos.</p><label>k = <output id="v">3</output></label><input id="p" type="range" min="1" max="9" step="2" value="3" oninput="draw()"><svg viewBox="0 0 600 250" id="viz"></svg><p id="metric"></p></div><p><a href="../">Voltar ao catálogo de visualizações</a></p></main><script>function draw(){let k=Number(document.getElementById('p').value),dots=[[75,82,0],[125,126,0],[186,89,0],[228,165,0],[85,179,0],[355,67,1],[412,101,1],[315,170,1],[469,171,1],[519,85,1]],q=[280,112];let dist=dots.map((a,i)=>({...{a,i},d:Math.hypot(a[0]-q[0],a[1]-q[1])})).sort((a,b)=>a.d-b.d);let sel=dist.slice(0,k),v=sel.reduce((v,o)=>v+o.a[2],0);document.getElementById('v').textContent=k;document.getElementById('metric').textContent='Classe prevista: '+(v>k/2?'vermelha':'azul')+' ('+Math.max(v,k-v)+' de '+k+' votos)';document.getElementById('viz').innerHTML=dots.map((a,i)=>'<circle cx="'+a[0]+'" cy="'+a[1]+'" r="10" fill="'+(a[2]?'#cc3048':'#2449a4')+'" stroke="'+(sel.some(o=>o.i===i)?'#008538':'white')+'" stroke-width="'+(sel.some(o=>o.i===i)?5:2)+'"/>').join('')+'<text x="270" y="118" fill="#111" font-size="27">★</text>';}draw();</script></body></html>
