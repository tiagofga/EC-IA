<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vizinhos e votação KNN</title><style>body{font:18px system-ui,Arial;margin:0;background:#f9fafc;color:#171c38}.wrap{max-width:830px;margin:35px auto;padding:22px}h1{background:#2935aa;color:white;padding:20px;border-radius:10px}input[type=range]{width:100%}.card{background:white;border:1px solid #c8cde1;border-radius:10px;padding:24px}.track{height:28px;background:#cc3048;border-radius:8px;overflow:hidden}.track div{height:100%;background:#2549a5}.inputs{display:flex;gap:12px;flex-wrap:wrap}.inputs input{width:90px;display:block;font-size:18px}svg{width:100%;height:280px}p{line-height:1.6}</style></head><body><main class="wrap"><h1>Vizinhos e votação KNN</h1><div class="card"><p>Altere os controles e observe as consequências. Esta é uma visualização conceitual: não substitui o ajuste real dos modelos.</p><label>k = <output id="v">3</output></label><input id="p" type="range" min="1" max="9" step="2" value="3" oninput="draw()"><svg viewBox="0 0 600 250" id="viz"></svg><p id="metric"></p></div><p><a href="README.md">Notas de uso da visualização</a></p></main><script>function draw(){let k=Number(document.getElementById('p').value),dots=[[75,82,0],[125,126,0],[186,89,0],[228,165,0],[85,179,0],[355,67,1],[412,101,1],[315,170,1],[469,171,1],[519,85,1]],q=[280,112];let dist=dots.map((a,i)=>({...{a,i},d:Math.hypot(a[0]-q[0],a[1]-q[1])})).sort((a,b)=>a.d-b.d);let sel=dist.slice(0,k),v=sel.reduce((v,o)=>v+o.a[2],0);document.getElementById('v').textContent=k;document.getElementById('metric').textContent='Classe prevista: '+(v>k/2?'vermelha':'azul')+' ('+Math.max(v,k-v)+' de '+k+' votos)';document.getElementById('viz').innerHTML=dots.map((a,i)=>'<circle cx="'+a[0]+'" cy="'+a[1]+'" r="10" fill="'+(a[2]?'#cc3048':'#2449a4')+'" stroke="'+(sel.some(o=>o.i===i)?'#008538':'white')+'" stroke-width="'+(sel.some(o=>o.i===i)?5:2)+'"/>').join('')+'<text x="270" y="118" fill="#111" font-size="27">★</text>';}draw();</script></body></html>
