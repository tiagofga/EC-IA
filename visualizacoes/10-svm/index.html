<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kernel RBF: influência de gamma</title><style>body{font:18px system-ui,Arial;margin:0;background:#f9fafc;color:#171c38}.wrap{max-width:830px;margin:35px auto;padding:22px}h1{background:#2935aa;color:white;padding:20px;border-radius:10px}input[type=range]{width:100%}.card{background:white;border:1px solid #c8cde1;border-radius:10px;padding:24px}.track{height:28px;background:#cc3048;border-radius:8px;overflow:hidden}.track div{height:100%;background:#2549a5}.inputs{display:flex;gap:12px;flex-wrap:wrap}.inputs input{width:90px;display:block;font-size:18px}svg{width:100%;height:280px}p{line-height:1.6}</style></head><body><main class="wrap"><h1>Kernel RBF: influência de gamma</h1><div class="card"><p>Altere os controles e observe as consequências. Esta é uma visualização conceitual: não substitui o ajuste real dos modelos.</p><label>γ = <output id="v">0.5</output></label><input id="p" type="range" min="-2" max="2" step="0.1" value="-0.3" oninput="draw()"><svg viewBox="0 0 600 260" id="viz"></svg><p id="metric"></p></div><p><a href="README.md">Notas de uso da visualização</a></p></main><script>function draw(){let gamma=Math.pow(10,Number(document.getElementById('p').value)),path=[];for(let i=0;i<=550;i+=5){let d=(i-275)/65;path.push((i===0?'M':'L')+(i+25)+' '+(230-185*Math.exp(-gamma*d*d)).toFixed(2))}document.getElementById('v').textContent=gamma.toFixed(3);document.getElementById('metric').textContent='K(x,z) = exp(-γ ||x-z||²). γ maior = influência mais local.';document.getElementById('viz').innerHTML='<path d="'+path.join(' ')+'" stroke="#2b3caf" stroke-width="4" fill="none"/><path d="M300 18 V230 M25 230 H575" stroke="#777" stroke-width="1"/>';}draw();</script></body></html>
