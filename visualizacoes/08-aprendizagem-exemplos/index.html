<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entropia e Gini</title><style>:root{color-scheme:light dark;font-family:system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#182636;font-size:16px;line-height:1.6}.wrap{width:min(100% - 2rem,820px);margin:2rem auto}h1{font-size:clamp(1.35rem,3vw,2rem);line-height:1.3;background:#19528c;color:#fff;padding:1.3rem 1.5rem;border-radius:12px;margin:0 0 1rem}.card{background:#fff;border:1px solid #c9d7e5;border-radius:12px;padding:1.5rem;box-shadow:0 4px 16px #15283a0b}p{margin:.65rem 0 1.1rem}label{display:block;font-weight:650}input[type=range]{display:block;width:100%;margin:1rem 0;accent-color:#187342}input[type=number]{display:block;width:100%;min-height:44px;padding:.5rem;border:1px solid #8396a9;border-radius:6px;font-size:1rem}.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1rem}svg{width:100%;height:auto;max-height:300px;background:#f8fafc;border:1px solid #d4e1ee;border-radius:8px}output{font-variant-numeric:tabular-nums;color:#17603c}#metric{font-weight:650;line-height:1.8}.track{height:28px;background:#bf3e51;border-radius:7px;overflow:hidden}.track div{height:100%;background:#2859b0}a{color:#185fa8}a:focus-visible,input:focus-visible{outline:3px solid #e2a93a;outline-offset:3px}@media(prefers-color-scheme:dark){body{background:#121820;color:#e4eaf1}.card{background:#1d2834;border-color:#415364}svg{background:#eaf0f7}a{color:#8bc3ff}output{color:#8bddad}}</style></head><body><main class="wrap"><h1>Entropia e Gini</h1><div class="card"><p>Altere um parâmetro por vez, observe a mudança e compare com a teoria. Demonstração conceitual, sem treinamento de modelos.</p><label>Proporção positiva: <output id="v">50%</output></label><input type="range" id="p" min="0" max="100" value="50" oninput="draw()"><p id="metric"></p><div class="track"><div id="positive"></div></div></div><p><a href="../../">Voltar ao catálogo de visualizações</a></p></main><script>function draw(){let p=Number(document.getElementById('p').value)/100; let ent=(p===0||p===1)?0:-p*Math.log2(p)-(1-p)*Math.log2(1-p);let g=2*p*(1-p);document.getElementById('v').textContent=(p*100).toFixed(0)+'%';document.getElementById('metric').textContent='Entropia = '+ent.toFixed(3)+' bit(s) | Gini = '+g.toFixed(3);document.getElementById('positive').style.width=(p*100)+'%';}draw();</script></body></html>
