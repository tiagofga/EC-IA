<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entropia e Gini</title><style>body{font:18px system-ui,Arial;margin:0;background:#f9fafc;color:#171c38}.wrap{max-width:830px;margin:35px auto;padding:22px}h1{background:#2935aa;color:white;padding:20px;border-radius:10px}input[type=range]{width:100%}.card{background:white;border:1px solid #c8cde1;border-radius:10px;padding:24px}.track{height:28px;background:#cc3048;border-radius:8px;overflow:hidden}.track div{height:100%;background:#2549a5}.inputs{display:flex;gap:12px;flex-wrap:wrap}.inputs input{width:90px;display:block;font-size:18px}svg{width:100%;height:280px}p{line-height:1.6}</style></head><body><main class="wrap"><h1>Entropia e Gini</h1><div class="card"><p>Altere os controles e observe as consequências. Esta é uma visualização conceitual: não substitui o ajuste real dos modelos.</p><label>Proporção positiva: <output id="v">50%</output></label><input type="range" id="p" min="0" max="100" value="50" oninput="draw()"><p id="metric"></p><div class="track"><div id="positive"></div></div></div><p><a href="README.md">Notas de uso da visualização</a></p></main><script>function draw(){let p=Number(document.getElementById('p').value)/100; let ent=(p===0||p===1)?0:-p*Math.log2(p)-(1-p)*Math.log2(1-p);let g=2*p*(1-p);document.getElementById('v').textContent=(p*100).toFixed(0)+'%';document.getElementById('metric').textContent='Entropia = '+ent.toFixed(3)+' bit(s) | Gini = '+g.toFixed(3);document.getElementById('positive').style.width=(p*100)+'%';}draw();</script></body></html>
